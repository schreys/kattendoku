<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kattendoku</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <main class="app">
    <header>
      <h1>Kattendoku</h1>
      <div class="tabs" id="tabs">
        <button data-diff="normal">Normaal</button>
        <button data-diff="hard">Moeilijk</button>
        <button data-diff="ultra">Ultra</button>
      </div>
    </header>

    <section class="status">
      <div id="levelLabel">Level 1</div>
      <div id="counter" class="counter" aria-label="Geplaatste katten">
        <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M18 42 L22 8 L43 27 Q50 25 57 27 L78 8 L82 42 Q91 62 80 78 Q68 93 50 93 Q32 93 20 78 Q9 62 18 42Z" fill="currentColor"/></svg>
        <span id="counterText">0/0</span>
      </div>
      <div id="timer">00:00</div>
    </section>

    <div class="board-wrap">
      <div id="board" class="board"></div>
      <div id="loading" class="loading hidden">Puzzel genereren…</div>
    </div>

    <nav class="actions">
      <button id="btnLevels">Levels</button>
      <button id="btnHint">Hint</button>
      <button id="btnUndo">Ongedaan</button>
      <button id="btnRestart">Opnieuw</button>
      <button id="btnHelp" aria-label="Regels">?</button>
    </nav>
    <p id="message" class="tip" data-tip="1e klik: X · 2e klik: kat · 3e klik: wissen · sleep om meerdere X'en te zetten"></p>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div id="modalButtons" class="modal-buttons"></div>
    </div>
  </div>

  <script src="generator.js?v=3"></script>
  <script src="game.js?v=3"></script>
</body>
</html>
