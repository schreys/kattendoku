<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kattendoku</title>
    <link rel="stylesheet" href="style.css?v=33" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Kattendoku</h1>
        <button id="btnHelp" class="help-btn" aria-label="Regels">?</button>
      </header>

      <section class="status">
        <div id="levelLabel">Level 1</div>
        <div class="status-center">
          <div id="counter" class="counter" aria-label="Geplaatste katten">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <path
                d="M18 42 L22 8 L43 27 Q50 25 57 27 L78 8 L82 42 Q91 62 80 78 Q68 93 50 93 Q32 93 20 78 Q9 62 18 42Z"
                fill="currentColor"
              />
            </svg>
            <span id="counterText">0/0</span>
          </div>
          <div id="hearts" class="hearts" aria-label="Hartjes"></div>
        </div>
        <div id="timer">00:00</div>
      </section>

      <div class="board-wrap">
        <div id="board" class="board"></div>
        <div id="loading" class="loading hidden">Puzzel genereren…</div>
      </div>

      <nav class="actions">
        <button id="btnLevels">Levels</button>
        <button id="btnHint">Hint</button>
        <button id="btnRestart">Opnieuw</button>
        <button id="btnScores">Highscores</button>
      </nav>
      <p
        id="message"
        class="tip"
        data-tip="klik: X aan/uit · dubbelklik: kat · sleep om meerdere X'en te zetten"
      ></p>
    </main>

    <div id="modal" class="modal hidden">
      <div class="modal-card">
        <h2 id="modalTitle"></h2>
        <div id="modalBody"></div>
        <div id="modalButtons" class="modal-buttons"></div>
      </div>
    </div>

    <script src="config.js?v=33"></script>
    <script src="generator.js?v=33"></script>
    <script src="fx.js?v=33"></script>
    <script src="game.js?v=33"></script>
  </body>
</html>
